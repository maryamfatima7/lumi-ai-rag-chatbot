<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lumi AI — AI Assistant</title>

    <style>

        .sidebar {
    position: relative;
}

.sidebar-close {
    position: absolute;
    top: 18px;
    right: 18px;

    width: 34px;
    height: 34px;

    border: none;
    border-radius: 10px;

    background: var(--surface-2);
    color: var(--muted);

    font-size: 18px;
    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: all 0.2s ease;
}

.sidebar-close:hover {
    background: var(--accent);
    color: white;
}

        :root {
    --bg: #f5f3f0;
    --surface: #ffffff;
    --surface-2: #eee9e3;
    --border: #ddd5cc;
    --text: #211d19;
    --muted: #81776e;

    --accent: #a88968;
    --accent-2: #c3a98c;
    --user: #a88968;

    --assistant: #ffffff;
    --danger: #ef4444;
    --success: #22c55e;
}

body.dark {
    --bg: #090807;
    --surface: #12100f;
    --surface-2: #1b1816;
    --border: #302923;
    --text: #f5f1ed;
    --muted: #a59b92;

    --accent: #ad8b6b;
    --accent-2: #c5a889;
    --user: #ad8b6b;

    --assistant: #171412;
    --danger: #ef4444;
    --success: #22c55e;
}


        html,
        body {

            width: 100%;
            height: 100%;
        }


        body {

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: var(--bg);
            color: var(--text);

            overflow: hidden;

            transition:
                background 0.25s ease,
                color 0.25s ease;
        }


        button,
        input,
        textarea {

            font: inherit;
        }


        button {

            cursor: pointer;
        }


        /* ====================================================
           APP
        ==================================================== */

        .app {

            width: 100%;
            height: 100vh;

            display: flex;
        }


        /* ====================================================
           SIDEBAR
        ==================================================== */

        .sidebar {

            width: 285px;
            flex-shrink: 0;

            background: var(--surface);

            border-right:
                1px solid var(--border);

            display: flex;
            flex-direction: column;

            padding: 18px;
        }


        .brand {

            display: flex;
            align-items: center;

            gap: 12px;

            margin-bottom: 20px;
        }


        .brand-icon {

            width: 44px;
            height: 44px;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            font-size: 19px;
            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent-2)
                );

            box-shadow:
                0 9px 22px rgba(
                    173,
                    139,
                    107,
                    0.22
                );
        }


        .brand-text h1 {

            font-size: 18px;
            line-height: 1.1;
        }


        .brand-text span {

            display: block;

            color: var(--muted);

            font-size: 11px;

            margin-top: 4px;
        }


        .new-chat {

            width: 100%;

            border: none;

            border-radius: 12px;

            padding: 12px;

            color: white;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent-2)
                );

            box-shadow:
                0 8px 20px rgba(
                    108,
                    99,
                    255,
                    0.18
                );

            margin-bottom: 20px;
        }


        .sidebar-title {

            color: var(--muted);

            text-transform: uppercase;

            letter-spacing: 0.08em;

            font-size: 10px;

            font-weight: 700;

            margin: 5px 4px 10px;
        }


        .history {

            flex: 1;

            overflow-y: auto;

            padding-right: 3px;

            min-height: 100px;
        }


        .history-empty {

            color: var(--muted);

            font-size: 12px;

            line-height: 1.5;

            padding: 12px 5px;
        }


        .history-item {

            width: 100%;

            display: flex;
            align-items: center;

            gap: 8px;

            border: none;

            background: transparent;

            color: var(--text);

            border-radius: 10px;

            padding: 10px;

            margin-bottom: 5px;

            text-align: left;

            font-size: 12px;
        }


        .history-item:hover,
        .history-item.active {

            background: var(--surface-2);
        }


        .history-text {

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;
        }


        /* DOCUMENT PANEL */

        .documents-section {

            border-top:
                1px solid var(--border);

            padding-top: 13px;

            margin-top: 12px;
        }


        .documents-header {

            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 8px;
        }


        .document-count {

            color: var(--muted);

            font-size: 10px;
        }


        .documents {

            max-height: 150px;

            overflow-y: auto;
        }


        .document-empty {

            color: var(--muted);

            font-size: 11px;

            line-height: 1.4;
        }


        .document-item {

            display: flex;
            align-items: center;

            gap: 7px;

            padding: 7px;

            border-radius: 8px;

            background: var(--surface-2);

            margin-bottom: 5px;
        }


        .document-name {

            flex: 1;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;

            font-size: 10px;
        }


        .document-delete {

            border: none;

            background: transparent;

            color: var(--muted);

            font-size: 12px;
        }


        .document-delete:hover {

            color: var(--danger);
        }


        .sidebar-bottom {

            display: grid;

            gap: 7px;

            padding-top: 12px;
        }


        .side-btn {

            width: 100%;

            border:
                1px solid var(--border);

            background: var(--surface);

            color: var(--text);

            border-radius: 10px;

            padding: 9px 11px;

            text-align: left;

            font-size: 11px;
        }


        .side-btn:hover {

            background: var(--surface-2);
        }


        /* ====================================================
           MAIN
        ==================================================== */

        .main {

            min-width: 0;

            flex: 1;

            display: flex;
            flex-direction: column;
        }


        .topbar {

            height: 70px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 22px;

            background: var(--surface);

            border-bottom:
                1px solid var(--border);
        }


        .mobile-menu {

            display: none;

            border: none;

            background: transparent;

            color: var(--text);

            font-size: 21px;
        }


        .topbar-right {

            display: flex;
            align-items: center;

            gap: 9px;
        }


        .status {

            display: flex;
            align-items: center;

            gap: 6px;

            color: var(--muted);

            font-size: 10px;
        }


        .status-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--success);
        }


        .mode-switch {

            display: flex;

            padding: 4px;

            background: var(--surface-2);

            border:
                1px solid var(--border);

            border-radius: 11px;
        }


        .mode-switch button {

            border: none;

            background: transparent;

            color: var(--muted);

            border-radius: 8px;

            padding: 7px 11px;

            font-size: 11px;

            font-weight: 600;
        }


        .mode-switch button.active {

            background: var(--surface);

            color: var(--text);

            box-shadow:
                0 2px 7px rgba(
                    0,
                    0,
                    0,
                    0.07
                );
        }


        .theme-btn {

            width: 36px;
            height: 36px;

            border:
                1px solid var(--border);

            border-radius: 10px;

            background: var(--surface);

            color: var(--text);

            font-size: 16px;
        }


        /* ====================================================
           CHAT
        ==================================================== */

        .chat {

            flex: 1;

            overflow-y: auto;

            padding: 28px 18px;
        }


        .chat-inner {

            max-width: 900px;

            min-height: 100%;

            margin: 0 auto;

            display: flex;
            flex-direction: column;
        }


        .welcome {

            width: min(
                680px,
                100%
            );

            margin: auto;

            text-align: center;

            padding: 30px 15px;
        }


        .welcome-logo {

            width: 68px;
            height: 68px;

            margin: 0 auto 18px;

            border-radius: 21px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            font-size: 28px;
            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent-2)
                );

            box-shadow:
                0 15px 35px rgba(
                    108,
                    99,
                    255,
                    0.22
                );
        }


        .welcome h2 {

            font-size:
                clamp(
                    25px,
                    4vw,
                    35px
                );

            margin-bottom: 9px;
        }


        .welcome p {

            color: var(--muted);

            font-size: 13px;

            line-height: 1.6;
        }


        .suggestions {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

            margin-top: 24px;
        }


        .suggestion {

            border:
                1px solid var(--border);

            border-radius: 12px;

            background: var(--surface);

            color: var(--text);

            padding: 13px;

            text-align: left;

            font-size: 11px;

            transition:
                transform 0.2s ease,
                border 0.2s ease;
        }


        .suggestion:hover {

            transform: translateY(-2px);

            border-color:
                var(--accent);
        }


        .message {

            display: flex;

            gap: 11px;

            margin-bottom: 22px;
        }


        .message.user {

            justify-content: flex-end;
        }


        .avatar {

            width: 34px;
            height: 34px;

            flex-shrink: 0;

            border-radius: 11px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 10px;

            font-weight: 800;
        }


        .assistant .avatar {

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent-2)
                );
        }


        .user .avatar {

            order: 2;

            color: var(--text);

            background: var(--surface-2);
        }


        .bubble {

            max-width:
                min(
                    720px,
                    84%
                );

            padding: 12px 14px;

            border-radius: 16px;

            font-size: 13px;

            line-height: 1.65;

            white-space: pre-wrap;

            overflow-wrap: anywhere;
        }


        .assistant .bubble {

            background: var(--assistant);

            border:
                1px solid var(--border);

            border-top-left-radius: 5px;

            box-shadow: var(--shadow);
        }


        .user .bubble {

            color: white;

            background: var(--user);

            border-top-right-radius: 5px;
        }


        .sources {

            display: flex;
            flex-wrap: wrap;

            gap: 5px;

            margin-top: 9px;
        }


        .source {

            padding: 5px 8px;

            border-radius: 7px;

            background: var(--surface-2);

            color: var(--muted);

            font-size: 9px;
        }


        .typing {

            display: flex;

            gap: 5px;

            padding: 5px 2px;
        }


        .typing span {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--muted);

            animation:
                typing 1s infinite ease-in-out;
        }


        .typing span:nth-child(2) {

            animation-delay: 0.15s;
        }


        .typing span:nth-child(3) {

            animation-delay: 0.3s;
        }


        @keyframes typing {

            0%,
            60%,
            100% {

                opacity: 0.3;

                transform:
                    translateY(0);
            }

            30% {

                opacity: 1;

                transform:
                    translateY(-3px);
            }
        }


        /* ====================================================
           COMPOSER
        ==================================================== */

        .composer-area {

            padding:
                10px
                18px
                17px;

            background:
                linear-gradient(
                    to top,
                    var(--bg) 70%,
                    transparent
                );
        }


        .composer {

            max-width: 900px;

            margin: 0 auto;

            background: var(--surface);

            border:
                1px solid var(--border);

            border-radius: 17px;

            padding: 9px;

            box-shadow: var(--shadow);
        }


        .composer textarea {

            width: 100%;

            min-height: 45px;
            max-height: 150px;

            resize: none;

            outline: none;

            border: none;

            background: transparent;

            color: var(--text);

            padding: 7px;

            font-size: 13px;

            line-height: 1.5;
        }


        .composer textarea::placeholder {

            color: var(--muted);
        }


        .composer-actions {

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                3px
                2px
                1px;
        }


        .left-actions {

            display: flex;
            align-items: center;

            gap: 7px;
        }


        .icon-btn {

            width: 35px;
            height: 35px;

            border:
                1px solid var(--border);

            border-radius: 10px;

            background: var(--surface);

            color: var(--text);
        }


        .icon-btn:hover {

            background: var(--surface-2);
        }


        .file-name {

            max-width: 190px;

            color: var(--muted);

            font-size: 9px;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;
        }


        .send-btn {

            width: 37px;
            height: 37px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent-2)
                );

            color: white;

            font-size: 16px;
        }


        .send-btn:disabled {

            opacity: 0.5;

            cursor: not-allowed;
        }


        .footer-note {

            max-width: 900px;

            margin: 6px auto 0;

            text-align: center;

            color: var(--muted);

            font-size: 9px;
        }


        /* ====================================================
           TOAST
        ==================================================== */

        .toast-container {

            position: fixed;

            right: 18px;
            top: 18px;

            z-index: 1000;

            display: flex;
            flex-direction: column;

            gap: 8px;
        }


        .toast {

            min-width: 240px;
            max-width: 340px;

            padding: 11px 13px;

            border-radius: 11px;

            background: var(--surface);

            border:
                1px solid var(--border);

            color: var(--text);

            box-shadow: var(--shadow);

            font-size: 11px;

            animation:
                toastIn 0.25s ease;
        }


        .toast.success {

            border-left:
                3px solid var(--success);
        }


        .toast.error {

            border-left:
                3px solid var(--danger);
        }


        @keyframes toastIn {

            from {

                opacity: 0;

                transform:
                    translateY(-8px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* ====================================================
           MOBILE
        ==================================================== */

        @media (
            max-width: 760px
        ) {

            .sidebar {

                position: fixed;

                z-index: 500;

                left: 0;
                top: 0;
                bottom: 0;

                transform:
                    translateX(-100%);

                box-shadow: var(--shadow);

                transition:
                    transform 0.25s ease;
            }


            .sidebar.open {

                transform:
                    translateX(0);
            }


            .mobile-menu {

                display: block;
            }


            .status {

                display: none;
            }


            .topbar {

                padding: 0 12px;
            }


            .chat {

                padding:
                    18px 11px;
            }


            .composer-area {

                padding:
                    8px
                    9px
                    13px;
            }


            .suggestions {

                grid-template-columns: 1fr;
            }


            .bubble {

                max-width: 89%;
            }
        }

    </style>

</head>


<body>

<div class="app">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside
        class="sidebar"
        id="sidebar">

        <button class="sidebar-close" id="sidebarCloseBtn" aria-label="Close sidebar">
    ✕
</button>



        <div class="brand">

            <div class="brand-icon">
                L
            </div>

            <div class="brand-text">

                <h1>Lumi AI</h1>

                <span>
                    AI Assistant + RAG
                </span>

            </div>

        </div>


        <button
            class="new-chat"
            id="newChatBtn"
        >
            + New Chat
        </button>


        <div class="sidebar-title">
            Chat History
        </div>


        <div
            class="history"
            id="history"
        >
        </div>


        <!-- DOCUMENTS -->

        <div class="documents-section">

            <div class="documents-header">

                <div class="sidebar-title">
                    Knowledge Base
                </div>

                <span
                    class="document-count"
                    id="documentCount"
                >
                    0 docs
                </span>

            </div>


            <div
                class="documents"
                id="documents"
            >
            </div>

        </div>


        <div class="sidebar-bottom">

            <button
                class="side-btn"
                id="clearHistoryBtn"
            >
                🗑 Clear Chat History
            </button>


            <button
                class="side-btn"
                id="clearKnowledgeBtn"
            >
                🧹 Clear Knowledge Base
            </button>

        </div>

    </aside>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">


        <header class="topbar">

            <button
                class="mobile-menu"
                id="mobileMenuBtn"
            >
                ☰
            </button>


            <div class="topbar-right">

                <div class="status">

                    <span class="status-dot"></span>

                    <span>
                        Lumi AI Online
                    </span>

                </div>


                <div class="mode-switch">

                    <button
                        id="normalMode"
                    >
                        Normal
                    </button>


                    <button
                        id="ragMode"
                    >
                        RAG
                    </button>

                </div>


                <button
                    class="theme-btn"
                    id="themeBtn"
                    title="Toggle theme"
                >
                    ☾
                </button>

            </div>

        </header>


        <!-- =================================================
             CHAT AREA
        ================================================== -->

        <section
            class="chat"
            id="chat"
        >

            <div
                class="chat-inner"
                id="chatInner"
            >

            </div>

        </section>


        <!-- =================================================
             COMPOSER
        ================================================== -->

        <div class="composer-area">

            <div class="composer">

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="Message Lumi AI..."
                ></textarea>


                <div class="composer-actions">

                    <div class="left-actions">

                        <input
                            type="file"
                            id="fileInput"
                            accept=".pdf,.docx,.txt"
                            hidden
                        >


                        <button
                            class="icon-btn"
                            id="uploadBtn"
                            title="Upload PDF, DOCX or TXT"
                        >
                            📎
                        </button>


                        <span
                            class="file-name"
                            id="fileName"
                        >
                        </span>

                    </div>


                    <button
                        class="send-btn"
                        id="sendBtn"
                        title="Send message"
                    >
                        ➤
                    </button>

                </div>

            </div>


            <div class="footer-note">

                Lumi AI can make mistakes.
                Verify important information.

            </div>

        </div>

    </main>

</div>


<div
    class="toast-container"
    id="toastContainer"
>
</div>


<script>


    /* ========================================================
       CONFIGURATION
    ======================================================== */

    const CHAT_STORAGE_KEY =
        "lumi_ai_chats_v1";

    const THEME_STORAGE_KEY =
        "lumi_ai_theme_v1";

    const MODE_STORAGE_KEY =
        "lumi_ai_mode_v1";


    let conversations = [];

    let currentConversation = null;

    let currentMode =
        localStorage.getItem(
            MODE_STORAGE_KEY
        ) || "normal";


    /* ========================================================
       ELEMENTS
    ======================================================== */

    const chat =
        document.getElementById(
            "chat"
        );


    const chatInner =
        document.getElementById(
            "chatInner"
        );


    const input =
        document.getElementById(
            "messageInput"
        );


    const sendBtn =
        document.getElementById(
            "sendBtn"
        );


    const historyElement =
        document.getElementById(
            "history"
        );


    const fileInput =
        document.getElementById(
            "fileInput"
        );


    const fileName =
        document.getElementById(
            "fileName"
        );


    const toastContainer =
        document.getElementById(
            "toastContainer"
        );


    const sidebar =
        document.getElementById(
            "sidebar"
        );


    /* ========================================================
       TOAST
    ======================================================== */

    function showToast(
        message,
        type = "success"
    ) {

        const toast =
            document.createElement(
                "div"
            );


        toast.className =
            `toast ${type}`;


        toast.textContent =
            message;


        toastContainer.appendChild(
            toast
        );


        setTimeout(
            () => {

                toast.remove();

            },
            3500
        );
    }


    /* ========================================================
       THEME
    ======================================================== */

    function applyTheme(
        theme
    ) {

        document.body.classList.toggle(
            "dark",
            theme === "dark"
        );


        document.getElementById(
            "themeBtn"
        ).textContent =
            theme === "dark"
                ? "☀"
                : "☾";


        localStorage.setItem(
            THEME_STORAGE_KEY,
            theme
        );
    }


    const savedTheme =
        localStorage.getItem(
            THEME_STORAGE_KEY
        ) || "dark";


    applyTheme(
        savedTheme
    );


    document
        .getElementById(
            "themeBtn"
        )
        .addEventListener(
            "click",
            () => {

                const isDark =
                    document.body.classList.contains(
                        "dark"
                    );


                applyTheme(
                    isDark
                        ? "light"
                        : "dark"
                );
            }
        );


    /* ========================================================
       MODE
    ======================================================== */

    function setMode(
        mode,
        notify = true
    ) {

        currentMode =
            mode;


        localStorage.setItem(
            MODE_STORAGE_KEY,
            mode
        );


        document
            .getElementById(
                "normalMode"
            )
            .classList.toggle(
                "active",
                mode === "normal"
            );


        document
            .getElementById(
                "ragMode"
            )
            .classList.toggle(
                "active",
                mode === "rag"
            );


        if (
            notify &&
            mode === "rag"
        ) {

            showToast(
                "RAG mode enabled. Ask questions about your uploaded documents.",
                "success"
            );
        }
    }


    document
        .getElementById(
            "normalMode"
        )
        .addEventListener(
            "click",
            () => setMode(
                "normal"
            )
        );


    document
        .getElementById(
            "ragMode"
        )
        .addEventListener(
            "click",
            () => setMode(
                "rag"
            )
        );


    setMode(
        currentMode,
        false
    );


    /* ========================================================
       CHAT STORAGE
    ======================================================== */

    function loadConversations() {

        try {

            conversations =
                JSON.parse(
                    localStorage.getItem(
                        CHAT_STORAGE_KEY
                    ) || "[]"
                );

        } catch {

            conversations = [];

        }


        renderHistory();
    }


    function saveConversations() {

        localStorage.setItem(
            CHAT_STORAGE_KEY,
            JSON.stringify(
                conversations
            )
        );


        renderHistory();
    }


    /* ========================================================
       NEW CONVERSATION
    ======================================================== */

    function createConversation() {

        const conversation = {

            id:
                Date.now().toString(),

            title:
                "New Chat",

            messages: [],

            createdAt:
                new Date().toISOString()
        };


        conversations.unshift(
            conversation
        );


        currentConversation =
            conversation;


        saveConversations();

        renderMessages();
    }

    /* ========================================================
   NEW CHAT BUTTON
======================================================== */

document
    .getElementById("newChatBtn")
    .addEventListener(
        "click",
        () => {

            createConversation();

            input.value = "";
            resizeTextarea();
            input.focus();

            sidebar.classList.remove("open");

            showToast(
                "New chat started.",
                "success"
            );
        }
    );


    /* ========================================================
       HISTORY
    ======================================================== */

    function renderHistory() {

        historyElement.innerHTML =
            "";


        if (
            !conversations.length
        ) {

            historyElement.innerHTML =
                `
                <div class="history-empty">
                    Your conversations will appear here.
                </div>
                `;

            return;
        }


        conversations.forEach(
            conversation => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "history-item";


                if (
                    currentConversation &&
                    currentConversation.id ===
                    conversation.id
                ) {

                    button.classList.add(
                        "active"
                    );
                }


                button.innerHTML =
                    `
                    <span>💬</span>
                    <span class="history-text">
                        ${escapeHtml(
                            conversation.title
                        )}
                    </span>
                    `;


                button.addEventListener(
                    "click",
                    () => {

                        currentConversation =
                            conversation;


                        renderMessages();

                        renderHistory();


                        sidebar.classList.remove(
                            "open"
                        );
                    }
                );


                historyElement.appendChild(
                    button
                );
            }
        );
    }


    /* ========================================================
       HTML ESCAPE
    ======================================================== */

    function escapeHtml(
        value
    ) {

        return String(
            value
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }


    /* ========================================================
       WELCOME
    ======================================================== */

    function createWelcome() {

        const wrapper =
            document.createElement(
                "div"
            );


        wrapper.className =
            "welcome";


        wrapper.innerHTML =
            `
            <div class="welcome-logo">
                L
            </div>

            <h2>
                Welcome to Lumi AI
            </h2>

            <p>
                Your intelligent AI assistant for
                everyday questions, conversations
                and document-based knowledge.
            </p>

            <div class="suggestions">

                <button
                    class="suggestion"
                    data-prompt="Explain artificial intelligence in simple words."
                >
                    Explain AI simply
                </button>

                <button
                    class="suggestion"
                    data-prompt="What can you help me with?"
                >
                    What can you help me with?
                </button>

                <button
                    class="suggestion"
                    data-prompt="Give me 5 interesting AI project ideas."
                >
                    Give me AI project ideas
                </button>

                <button
                    class="suggestion"
                    data-prompt="Explain Retrieval Augmented Generation in simple words."
                >
                    Explain RAG
                </button>

            </div>
            `;


        wrapper
            .querySelectorAll(
                ".suggestion"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            input.value =
                                button.dataset.prompt;

                            sendMessage();
                        }
                    );
                }
            );


        return wrapper;
    }


    /* ========================================================
       RENDER MESSAGES
    ======================================================== */

    function renderMessages() {

        chatInner.innerHTML =
            "";


        if (
            !currentConversation ||
            !currentConversation.messages.length
        ) {

            chatInner.appendChild(
                createWelcome()
            );

            return;
        }


        currentConversation.messages.forEach(
            message => {

                addMessageToDOM(
                    message.role,
                    message.content,
                    message.sources || []
                );
            }
        );


        scrollToBottom();
    }


    /* ========================================================
       ADD MESSAGE
    ======================================================== */

    function addMessageToDOM(
        role,
        content,
        sources = []
    ) {

        const message =
            document.createElement(
                "div"
            );


        message.className =
            `message ${role}`;


        const avatar =
            document.createElement(
                "div"
            );


        avatar.className =
            "avatar";


        avatar.textContent =
            role === "user"
                ? "You"
                : "L";


        const bubble =
            document.createElement(
                "div"
            );


        bubble.className =
            "bubble";


        bubble.textContent =
            content;


        if (
            role === "assistant" &&
            sources.length
        ) {

            const sourceContainer =
                document.createElement(
                    "div"
                );


            sourceContainer.className =
                "sources";


            sources.forEach(
                source => {

                    const tag =
                        document.createElement(
                            "span"
                        );


                    tag.className =
                        "source";


                    tag.textContent =
                        `📄 ${source}`;


                    sourceContainer.appendChild(
                        tag
                    );
                }
            );


            bubble.appendChild(
                sourceContainer
            );
        }


        message.appendChild(
            avatar
        );


        message.appendChild(
            bubble
        );


        chatInner.appendChild(
            message
        );
    }


    /* ========================================================
       TYPING INDICATOR
    ======================================================== */

    function showTyping() {

        removeTyping();


        const message =
            document.createElement(
                "div"
            );


        message.className =
            "message assistant";


        message.id =
            "typingMessage";


        message.innerHTML =
            `
            <div class="avatar">
                L
            </div>

            <div class="bubble">

                <div class="typing">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>
            `;


        chatInner.appendChild(
            message
        );


        scrollToBottom();
    }


    function removeTyping() {

        const element =
            document.getElementById(
                "typingMessage"
            );


        if (element) {

            element.remove();
        }
    }


    /* ========================================================
       SCROLL
    ======================================================== */

    function scrollToBottom() {

        setTimeout(
            () => {

                chat.scrollTop =
                    chat.scrollHeight;

            },
            20
        );
    }


    /* ========================================================
       SEND MESSAGE
    ======================================================== */

    async function sendMessage() {

        const message =
            input.value.trim();


        if (!message) {

            return;
        }


        if (!currentConversation) {

            createConversation();
        }


        const conversation =
            currentConversation;


        const previousHistory =
            conversation.messages.slice();


        conversation.messages.push(
            {
                role: "user",
                content: message,
                sources: []
            }
        );


        if (
            conversation.title ===
            "New Chat"
        ) {

            conversation.title =
                message.length > 40
                    ? message.slice(
                        0,
                        40
                    ) + "..."
                    : message;
        }


        saveConversations();

        renderMessages();


        input.value = "";

        resizeTextarea();


        showTyping();

        sendBtn.disabled = true;


        try {

            const response =
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                {
                                    message:
                                        message,

                                    history:
                                        previousHistory,

                                    rag_enabled:
                                        currentMode ===
                                        "rag"
                                }
                            )
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.error ||
                    "Lumi AI could not respond."
                );
            }


            removeTyping();


            conversation.messages.push(
                {
                    role: "assistant",
                    content: data.answer,
                    sources:
                        data.sources || []
                }
            );


            saveConversations();

            renderMessages();


            if (
                data.rag_used
            ) {

                showToast(
                    "Response generated using your documents.",
                    "success"
                );

            } else {

                showToast(
                    "Lumi AI responded successfully.",
                    "success"
                );
            }


        } catch (
            error
        ) {

            removeTyping();


            addMessageToDOM(
                "assistant",
                `Sorry, I couldn't complete that request.\n\n${error.message}`,
                []
            );


            showToast(
                error.message,
                "error"
            );


        } finally {

            sendBtn.disabled =
                false;

            input.focus();

            scrollToBottom();
        }
    }


    /* ========================================================
       TEXTAREA
    ======================================================== */

    function resizeTextarea() {

        input.style.height =
            "auto";


        input.style.height =
            Math.min(
                input.scrollHeight,
                150
            ) + "px";
    }


    input.addEventListener(
        "input",
        resizeTextarea
    );


    input.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                    "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );


    sendBtn.addEventListener(
        "click",
        sendMessage
    );


    /* ========================================================
       UPLOAD
    ======================================================== */

    document
        .getElementById(
            "uploadBtn"
        )
        .addEventListener(
            "click",
            () => {

                fileInput.click();
            }
        );


    fileInput.addEventListener(
        "change",
        async () => {

            const file =
                fileInput.files[0];


            if (!file) {

                return;
            }


            fileName.textContent =
                file.name;


            showToast(
                "Uploading and indexing document...",
                "success"
            );


            const formData =
                new FormData();


            formData.append(
                "file",
                file
            );


            try {

                const response =
                    await fetch(
                        "/api/upload",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.error ||
                        "Document upload failed."
                    );
                }


                showToast(
                    `${file.name} is ready for RAG.`,
                    "success"
                );


                setMode(
                    "rag",
                    false
                );


                await loadDocuments();


            } catch (
                error
            ) {

                showToast(
                    error.message,
                    "error"
                );


            } finally {

                fileInput.value =
                    "";

                setTimeout(
                    () => {
                        fileName.textContent =
                            "";
                    },
                    2000
                );
            }
        }
    );


    /* ========================================================
       DOCUMENTS
    ======================================================== */

    async function loadDocuments() {

        try {

            const response =
                await fetch(
                    "/api/documents"
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.error ||
                    "Could not load documents."
                );
            }


            renderDocuments(
                data.documents || []
            );


        } catch (
            error
        ) {

            console.error(
                error
            );
        }
    }


    function renderDocuments(
        documents
    ) {

        const container =
            document.getElementById(
                "documents"
            );


        const count =
            document.getElementById(
                "documentCount"
            );


        count.textContent =
            `${documents.length} ${
                documents.length === 1
                    ? "doc"
                    : "docs"
            }`;


        container.innerHTML =
            "";


        if (
            !documents.length
        ) {

            container.innerHTML =
                `
                <div class="document-empty">
                    No documents uploaded yet.
                </div>
                `;

            return;
        }


        documents.forEach(
            document => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "document-item";


                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "document-name";


                name.textContent =
                    `📄 ${document.filename}`;


                name.title =
                    document.filename;


                const deleteButton =
                    document.createElement(
                        "button"
                    );


                deleteButton.className =
                    "document-delete";


                deleteButton.textContent =
                    "×";


                deleteButton.title =
                    "Remove document";


                deleteButton.addEventListener(
                    "click",
                    () => {

                        deleteDocument(
                            document.filename
                        );
                    }
                );


                row.appendChild(
                    name
                );


                row.appendChild(
                    deleteButton
                );


                container.appendChild(
                    row
                );
            }
        );
    }


    async function deleteDocument(
        filename
    ) {

        const confirmed =
            confirm(
                `Remove "${filename}" from Lumi AI?`
            );


        if (!confirmed) {

            return;
        }


        try {

            const response =
                await fetch(
                    `/api/documents/${encodeURIComponent(
                        filename
                    )}`,
                    {
                        method:
                            "DELETE"
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.error ||
                    "Could not remove document."
                );
            }


            showToast(
                `${filename} removed from knowledge base.`,
                "success"
            );


            await loadDocuments();


        } catch (
            error
        ) {

            showToast(
                error.message,
                "error"
            );
        }
    }


    /* ========================================================
       CLEAR HISTORY
    ======================================================== */

    document
        .getElementById(
            "clearHistoryBtn"
        )
        .addEventListener(
            "click",
            () => {

                if (
                    !conversations.length
                ) {

                    showToast(
                        "There is no chat history to clear.",
                        "error"
                    );

                    return;
                }


                const confirmed =
                    confirm(
                        "Clear all saved chat history?"
                    );


                if (!confirmed) {

                    return;
                }


                conversations =
                    [];


                currentConversation =
                    null;


                localStorage.removeItem(
                    CHAT_STORAGE_KEY
                );


                renderHistory();

                renderMessages();


                showToast(
                    "Chat history cleared.",
                    "success"
                );
            }
        );


    /* ========================================================
       CLEAR KNOWLEDGE
    ======================================================== */

    document
        .getElementById(
            "clearKnowledgeBtn"
        )
        .addEventListener(
            "click",
            async () => {

                const confirmed =
                    confirm(
                        "Clear the entire Lumi AI knowledge base?"
                    );


                if (!confirmed) {

                    return;
                }


                try {

                    const response =
                        await fetch(
                            "/api/knowledge/clear",
                            {
                                method:
                                    "DELETE"
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        throw new Error(
                            data.error ||
                            "Could not clear knowledge base."
                        );
                    }


                    showToast(
                        "Knowledge base cleared.",
                        "success"
                    );


                    await loadDocuments();


                } catch (
                    error
                ) {

                    showToast(
                        error.message,
                        "error"
                    );
                }
            }
        );


    /* ========================================================
       MOBILE SIDEBAR
    ======================================================== */

    document
        .getElementById(
            "mobileMenuBtn"
        )
        .addEventListener(
            "click",
            () => {

                sidebar.classList.toggle(
                    "open"
                );
            }
        );


    /* ========================================================
       INITIALIZE
    ======================================================== */

    loadConversations();

    renderMessages();

    loadDocuments();

    input.focus();



</script>

</body>

</html>
